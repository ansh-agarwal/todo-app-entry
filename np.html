<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FBF7EC"><title>Notes · Paper</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="./note-base.css">
<style>
:root{--bg:#FBF7EC;--ink:#2B2620;--ink-soft:#6B6250;--ink-faint:#AEA184;--rule:#EBE0C8;--rule-2:#F2EAD6;

  --btn:#8A6A28;--btn-ink:#fff;--fmt-bg:#FEFCF6;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
.wrap{border-color:var(--rule)}
.divider{background:none;border-top:1px dashed var(--cbrule);height:0;margin:22px 0}
.blk .mk.bul{color:var(--accent)}

<body>
<div class="wrap">
  <div class="top"><span class="date" id="date"></span><span class="vtag">Paper · v10</span><a href="./note-styles.html">styles ↗</a></div>
  <div class="doc" id="doc"></div>
  <div class="bar"><button class="fmt" id="bBul" title="Bullet">•</button><button class="fmt" id="bTask" title="Task">☐</button><button class="new" id="bNew">＋ New</button></div>
</div>
<script src="./note.js"></script>
