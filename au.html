<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F5F5FB"><title>Aurora — capture</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="./f-base.css">
<style>
:root{--paper:transparent;--paper-2:transparent;--card:rgba(255,255,255,.58);--ink:#22212B;--ink-soft:#5A5870;--ink-faint:#9C9AB4;
  --rule:rgba(255,255,255,.7);--rule-2:rgba(255,255,255,.5);--cbrule:#B9B7D6;--accent:#6C63FF;--accent-soft:rgba(108,99,255,.14);--task:#6C63FF;
  --r:18px;--shadow:0 2px 10px rgba(60,50,110,.06),0 14px 40px rgba(60,50,110,.10);--on-accent:#fff;
  --serif:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:
  radial-gradient(1200px 720px at 12% -5%, #E7E1FF 0%, transparent 55%),
  radial-gradient(1000px 700px at 105% 15%, #D7F3EC 0%, transparent 52%),
  radial-gradient(1000px 820px at 60% 108%, #FDE8DE 0%, transparent 55%),
  #F5F5FB}
.wrap{background:transparent}
.card,.editor{background:var(--card);backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1);border:1px solid rgba(255,255,255,.75)}
.composer{background:rgba(255,255,255,.34);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.6)}
.tbtn{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.8)}
.editor:focus-within{box-shadow:0 0 0 3px var(--accent-soft),0 0 24px rgba(108,99,255,.14)}
.ln .mk.cb,.blk .mk.cb{border-width:1.4px;border-radius:50%}
.blk.done .mk.cb,.ln.done .mk.cb{box-shadow:0 0 12px rgba(108,99,255,.5)}
.blk .mk.bul,.ln .mk.bul{color:var(--accent)}
</style></head>
<body class="minimal">
<div class="wrap">
  <div class="top"><span class="date" id="date"></span><span class="vtag">Aurora · v6</span><span class="count" id="count"></span><a href="./f-designs.html">designs ↗</a></div>
  <div class="feed" id="feed"><div class="empty" id="empty">Write below. It gathers up here.</div></div>
  <div class="composer">
    <div class="toolbar"><button class="tbtn" id="bBul">•</button><button class="tbtn" id="bTask">☐</button></div>
    <div class="editor" id="editor"></div>
    <div class="crow"><button class="keep" id="keep">Keep</button></div>
  </div>
</div>
<script src="./f.js"></script>
</body></html>
