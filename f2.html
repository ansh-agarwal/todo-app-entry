<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FBFAF7"><title>Quiet line — type anywhere</title>
<style>
:root{--bg:#FBFAF7;--panel:#FFFFFF;--ink:#22262B;--ink-soft:#606771;--ink-faint:#A3A9B1;--rule:#ECEBE5;--rule-2:#F3F2EC;
  --accent:#2E7CF6;--accent-soft:#E9F1FE;--done:#2E7CF6;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --shadow:0 1px 2px rgba(20,24,28,.04),0 10px 30px rgba(20,24,28,.05)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;padding:16px 26px 0}
.top a{margin-left:auto;color:var(--ink-faint);text-decoration:none;font-size:13px;font-weight:600}
.hero{padding:30px 30px 14px}
.hero .greet{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.01em}
.hero .sub{color:var(--ink-faint);font-size:14px;margin-top:3px}
.composer{display:flex;align-items:center;gap:13px;padding:6px 30px 8px}
.composer .cir{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--ink-faint);flex:0 0 auto;transition:.15s}
.composer:focus-within .cir{border-color:var(--accent)}
.composer input{flex:1;border:none;outline:none;background:none;font-size:19px;color:var(--ink);font-family:var(--serif)}
.composer input::placeholder{color:var(--ink-faint)}
.list{flex:1;overflow-y:auto;padding:8px 30px 40px}
.row{display:flex;align-items:flex-start;gap:13px;padding:11px 0;border-bottom:1px solid var(--rule-2);animation:rise .26s ease}
@keyframes rise{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.row .cir{width:22px;height:22px;border-radius:50%;border:1.8px solid #C7CCD3;flex:0 0 auto;margin-top:2px;cursor:pointer;display:grid;place-items:center;transition:.14s}
.row .cir:hover{border-color:var(--accent)}
.row.done .cir{background:var(--accent);border-color:var(--accent)}
.row.done .cir::after{content:"✓";color:#fff;font-size:12px;font-weight:700}
.row .tx{font-size:16.5px;color:var(--ink);font-family:var(--serif);flex:1;line-height:1.4}
.row.done .tx{color:var(--ink-faint);text-decoration:line-through}
.chips{display:flex;gap:6px;margin-top:5px}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px}
.chip.due{border:1px solid var(--rule);color:var(--ink-soft)}
.chip.pri{background:#FBECD9;color:#B4530F}
.empty{color:var(--ink-faint);font-family:var(--serif);font-style:italic;font-size:16px;padding:20px 2px}
</style></head>
<body>
<div class="wrap">
  <div class="top"><a href="./f-variants.html">variants ↗</a></div>
  <div class="hero"><div class="greet" id="greet">Good evening</div><div class="sub" id="sub"></div></div>
  <div class="composer"><span class="cir"></span><input id="inp" autocomplete="off" spellcheck="false" placeholder="What's on your mind?"></div>
  <div class="list" id="list"><div class="empty" id="empty">A calm, open day. Add anything above.</div></div>
</div>
<script>
const inp=document.getElementById("inp"),list=document.getElementById("list");
const h=new Date().getHours();document.getElementById("greet").textContent=h<12?"Good morning":h<17?"Good afternoon":"Good evening";
document.getElementById("sub").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
function parse(t){let text=t,chips=[];const low=t.toLowerCase();
  const days=["today","tomorrow","tonight","monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
  for(const d of days){if(new RegExp("\\b"+d+"\\b").test(low)){chips.push({k:"due",t:d[0].toUpperCase()+d.slice(1)});break}}
  if(/(^|\s)!(\s|$)|!$/.test(t)){chips.push({k:"pri",t:"!"});text=text.replace(/!/g,"")}
  return{text:text.replace(/\s{2,}/g," ").trim()||t,chips}}
inp.addEventListener("keydown",e=>{if(e.key==="Enter"){const v=inp.value.trim();if(!v)return;const p=parse(v);
  const em=document.getElementById("empty");if(em)em.remove();
  const row=document.createElement("div");row.className="row";
  row.innerHTML='<span class="cir"></span><div style="flex:1"><div class="tx"></div></div>';
  row.querySelector(".tx").textContent=p.text;
  if(p.chips.length){const c=document.createElement("div");c.className="chips";p.chips.forEach(ch=>{const s=document.createElement("span");s.className="chip "+ch.k;s.textContent=ch.t;c.appendChild(s)});row.querySelector("div[style]").appendChild(c)}
  row.querySelector(".cir").onclick=()=>row.classList.toggle("done");
  list.prepend(row);inp.value=""}});
inp.focus();
</script>
</body></html>
