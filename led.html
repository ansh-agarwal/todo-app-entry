<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFFFFF"><title>Ledger — capture</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="./f-base.css">
<style>
:root{--paper:#FFFFFF;--paper-2:#FFFFFF;--card:#FFFFFF;--ink:#191919;--ink-soft:#5C5C5C;--ink-faint:#9C9C9C;
  --rule:#ECECEC;--rule-2:#F5F5F5;--cbrule:#C7C7C7;--accent:#191919;--accent-soft:#EFEFEF;--task:#191919;
  --r:10px;--shadow:none;--on-accent:#fff;
  --serif:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
body{background:#fff}
.top{border-bottom:1px solid var(--rule);padding-bottom:12px}
.top .date{font-family:var(--mono);font-size:12px;letter-spacing:.01em}
.vtag{font-family:var(--mono);background:transparent;border:1px solid var(--rule);color:var(--ink-soft);border-radius:5px;font-weight:500}
.feed{padding:6px 22px 8px}
.card{background:transparent;border:none;border-top:1px solid var(--rule);border-radius:0;box-shadow:none;padding:15px 2px}
.card .time{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.ln.title{font-size:16.5px;font-weight:650}
.ln .bd{font-size:15px}
.ln .mk.cb,.blk .mk.cb{border-width:1.3px;border-radius:5px;width:18px;height:18px}
.blk .mk.bul,.ln .mk.bul{color:var(--ink-faint);font-weight:400}
.editor{border:none;border-radius:0;background:transparent;padding:6px 2px;box-shadow:none}
.editor:focus-within{box-shadow:none}
.composer{background:#fff;border-top:1px solid var(--rule)}
.tbtn{border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink-soft)}
.tbtn:hover{border-color:#C7C7C7;color:var(--ink)}
.keep{background:var(--ink);color:#fff;border-radius:9px;font-weight:600;font-size:13.5px;padding:9px 20px}
.editor .blk:first-child[data-type="text"] .btx{font-size:18px;font-weight:650}
.blk .btx{font-size:16px}
</style></head>
<body class="minimal">
<div class="wrap">
  <div class="top"><span class="date" id="date"></span><span class="vtag">Ledger · v8</span><span class="count" id="count"></span><a href="./f-designs.html">designs ↗</a></div>
  <div class="feed" id="feed"><div class="empty" id="empty">Write below. It gathers up here.</div></div>
  <div class="composer">
    <div class="toolbar"><button class="tbtn" id="bBul">•</button><button class="tbtn" id="bTask">☐</button></div>
    <div class="editor" id="editor"></div>
    <div class="crow"><button class="keep" id="keep">Keep</button></div>
  </div>
</div>
<script src="./f.js"></script>
</body></html>
