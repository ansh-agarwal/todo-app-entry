<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FEF7FF"><title>Android style — capture</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./f-base.css">
<style>
:root{--paper:#FEF7FF;--paper-2:#F7F2FA;--card:#FFFFFF;--ink:#1D1B20;--ink-soft:#49454F;--ink-faint:#A7A2AC;
  --rule:#E7E0EC;--rule-2:#EFE9F3;--cbrule:#79747E;--accent:#6750A4;--accent-soft:#EADDFF;--task:#6750A4;
  --r:14px;--shadow:0 1px 2px rgba(0,0,0,.06);--on-accent:#fff;
  --serif:"Roboto",-apple-system,"Segoe UI",sans-serif;--sans:"Roboto",-apple-system,"Segoe UI",sans-serif}
.card,.editor{border-width:1px;border-color:var(--rule)}
.ln .mk.cb,.blk .mk.cb{border-width:1.5px;border-radius:3px;width:19px;height:19px}
.ln.done .mk.cb,.blk.done .mk.cb{border-radius:3px}
.blk .mk.bul,.ln .mk.bul{font-weight:400;color:var(--ink-faint)}
.tbtn{border-radius:20px}
.keep{border-radius:20px}
</style></head>
<body class="minimal">
<div class="wrap">
  <div class="top"><span class="date" id="date"></span><span class="vtag">Android · v5</span><span class="count" id="count"></span><a href="./f-designs.html">designs ↗</a></div>
  <div class="feed" id="feed"><div class="empty" id="empty">Write below. It gathers up here.</div></div>
  <div class="composer">
    <div class="toolbar"><button class="tbtn" id="bBul">•</button><button class="tbtn" id="bTask">☐</button></div>
    <div class="editor" id="editor"></div>
    <div class="crow"><button class="keep" id="keep">Keep</button></div>
  </div>
</div>
<script src="./f.js"></script>
</body></html>
