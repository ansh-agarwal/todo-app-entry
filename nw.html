<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFF7F1"><title>Notes · Warm</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./note-base.css">
<style>
:root{--bg:#FFF7F1;--ink:#3A2A20;--ink-soft:#7A6355;--ink-faint:#BCA595;--rule:#F1E2D6;--rule-2:#F7ECE3;
  --cbrule:#E0C7B6;--accent:#E8674C;--accent-soft:#FCE7E1;--on-accent:#fff;--cb-radius:50%;--title:24px;
  --btn:#E8674C;--btn-ink:#fff;--btn-r:22px;--fmt-bg:#fff;
  --sans:"Nunito",-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
body{font-weight:600}
.blk.tt .btx{font-weight:800}
.blk .mk.cb{border-width:2px;width:21px;height:21px}
.blk.done .mk.cb{animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.fmt{border-radius:12px;border-width:1.5px;font-weight:700}
.new{font-weight:800;box-shadow:0 5px 14px rgba(232,103,76,.28)}
.divider{background:none;border-top:2px dotted var(--rule);height:0;margin:22px 0}
</style></head>
<body>
<div class="wrap">
  <div class="top"><span class="date" id="date"></span><span class="vtag">Warm · v10</span><a href="./note-styles.html">styles ↗</a></div>
  <div class="doc" id="doc"></div>
  <div class="bar"><button class="fmt" id="bBul" title="Bullet">•</button><button class="fmt" id="bTask" title="Task">☐</button><button class="new" id="bNew">＋ New</button></div>
</div>
<script src="./note.js"></script>
</body></html>
