<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF"><title>Lull · Windows</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="./app-base.css"><style>
/* Windows · Fluent / WinUI */
:root{--accent:#0067C0;--accent-soft:#EAF2FB;--accent-ink:#004E96;
  --ink:#1B1B1B;--ink-soft:#5C5C5C;--ink-faint:#9A9A9A;--bg:#F3F3F3;--surface:#FBFBFB;--rule:#E5E5E5;--rule-2:#EDEDED;
  --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,Roboto,sans-serif;--mono:"Cascadia Code",Consolas,ui-monospace,monospace}
.cb{border-radius:4px !important;border-width:1.3px}
.goal .gk{border-radius:3px}
.brief{background:#EEF5FB;border-color:#D6E4F2}
.rail .ri.on{border-radius:5px}
.main{background:var(--surface)}
.tabbar,.capbar{background:var(--surface)}

</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail">
    <div class="brand"><div class="m">◍</div><h1>Lull</h1></div>
    <div class="ri on" data-v="capture"><span class="i">✎</span> Capture</div>
    <div class="ri" data-v="today"><span class="i">◔</span> Today</div>
    <div class="ri" data-v="plan"><span class="i">▦</span> Plan</div>
    <div class="ri" data-v="calendar"><span class="i">▤</span> Calendar</div>
  </nav>

  <main class="main">
    <!-- CAPTURE -->
    <section class="view on" id="v-capture" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="vhead"><div class="eyebrow" id="capDate"></div><h1>Capture <span class="sub">everything lands here first</span></h1></div>
      <div class="scroll" id="capList" style="flex:1"></div>
      <div class="capbar"><span class="plus">+</span><input id="capInput" placeholder="Type a thought — [] for a task" autocomplete="off"><span class="hint">↵</span></div>
    </section>

    <!-- TODAY -->
    <section class="view" id="v-today">
      <div class="vhead"><div class="eyebrow" id="todayEyebrow"></div><h1>Today <span class="sub" id="todayCount"></span></h1></div>
      <div class="scroll" id="todayScroll"></div>
    </section>

    <!-- PLAN -->
    <section class="view" id="v-plan">
      <div class="vhead"><div class="eyebrow">This week</div><h1>Plan</h1></div>
      <div class="scroll" id="planScroll"></div>
    </section>

    <!-- CALENDAR -->
    <section class="view" id="v-calendar">
      <div class="vhead"><div class="eyebrow">Month</div><h1>Calendar</h1></div>
      <div class="scroll"><div class="cal" id="calMount"></div></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="on" data-v="capture"><span class="i">✎</span>Capture</button>
    <button data-v="today"><span class="i">◔</span>Today</button>
    <button data-v="plan"><span class="i">▦</span>Plan</button>
    <button data-v="calendar"><span class="i">▤</span>Calendar</button>
  </nav>
</div>

<!-- schedule sheet -->
<div class="overlay" id="sheet"><div class="sheet">
  <div class="grab"></div><h3 id="sheetTitle">Schedule</h3><p id="sheetText"></p><div id="sheetBody"></div>
</div></div>

<!-- focus mode -->
<div class="focus" id="focus">
  <span class="close" id="focusClose">Done for now ✕</span>
  <div class="lbl">Focus</div>
  <div class="ft" id="focusText"></div>
  <div class="timer" id="focusTimer">25:00</div>
  <div class="ctl"><button class="start" id="focusStart">Start</button><button class="sec" id="focusDone">Mark done</button></div>
</div>

<script src="./app.js"></script>
<script>window.addEventListener("load",()=>{const e=document.getElementById("capDate");if(e)e.textContent=e.textContent.replace("app v14","app v14")});</script>
</body></html>
