<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFFFFF"><title>Command bar — Lull</title>
<link rel="stylesheet" href="./app.css">
<style>
.body{flex:1;display:flex;flex-direction:column;padding:26px 22px 20px;overflow:hidden}
.mode{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 4px 8px;height:14px}
.mode.cmd{color:#7A5AF8}
.bar{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--rule);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow);transition:.15s}
.bar.cmd{border-color:#7A5AF8;box-shadow:0 0 0 4px #F1EDFE}
.bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.bar.cmd:focus-within{border-color:#7A5AF8;box-shadow:0 0 0 4px #F1EDFE}
.bar .lead{font-size:18px;color:var(--ink-faint)}
.bar input{flex:1;border:none;outline:none;font-size:18px;background:none;font-family:var(--sans)}
.bar .kbd{font-size:11px;color:var(--ink-faint);border:1px solid var(--rule);border-radius:6px;padding:3px 7px;font-weight:600}
.detect{display:flex;gap:6px;align-items:center;min-height:22px;margin:10px 4px 0;flex-wrap:wrap}
.detect .lead{font-size:11.5px;color:var(--ink-faint)}
.palette{margin-top:10px;background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:none}
.palette.on{display:block}
.ci{display:flex;gap:11px;align-items:center;padding:11px 15px;font-size:14.5px;cursor:pointer;color:var(--ink)}
.ci.sel{background:#F1EDFE}
.ci .ig{width:20px;text-align:center;color:#7A5AF8}
.ci .tagx{margin-left:auto;font-size:10.5px;color:var(--ink-faint);border:1px solid var(--rule);border-radius:5px;padding:1px 6px}
.pnone{padding:11px 15px;color:var(--ink-faint);font-size:13px}
.recent{flex:1;overflow-y:auto;margin-top:18px}
.recent .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;padding:4px 4px 6px}
.empty{color:var(--ink-faint);font-family:var(--serif);font-style:italic;font-size:15px;padding:16px 4px}
.hintrow{margin:12px 4px 0;font-size:12px;color:var(--ink-faint)}
.hintrow b{color:var(--ink-soft);font-weight:600}
</style></head>
<body>
<div class="shell">
  <div class="top"><div class="mark i">◍</div><h1>Lull</h1><span class="sub">one bar for everything</span>
    <a class="back" href="./finalists.html">finalists ↗</a></div>
  <div class="body">
    <div class="mode" id="mode">Capture</div>
    <div class="bar" id="bar"><span class="lead" id="lead">+</span>
      <input id="inp" autocomplete="off" spellcheck="false" placeholder="Type a thought — or / for commands">
      <span class="kbd">⌘K</span></div>
    <div class="detect" id="detect"></div>
    <div class="palette" id="palette"></div>
    <div class="hintrow" id="hintrow"><b>↵</b> to capture · type <b>/</b> to jump, search or file · <b>↑↓</b> to pick</div>
    <div class="recent" id="recent"><div class="empty" id="empty">Nothing captured yet — start typing.</div></div>
  </div>
</div>
<div class="flash" id="flash">Captured ✓</div>
<script>
const inp=document.getElementById("inp"),bar=document.getElementById("bar"),mode=document.getElementById("mode"),lead=document.getElementById("lead"),
  detect=document.getElementById("detect"),palette=document.getElementById("palette"),recent=document.getElementById("recent"),hintrow=document.getElementById("hintrow");
const CMDS=[{i:"◎",t:"Go to Today",x:"jump"},{i:"📥",t:"Open Inbox",x:"jump"},{i:"🌙",t:"Move to Someday",x:"file"},{i:"🔍",t:"Search everything",x:"find"},{i:"＋",t:"New project…",x:"create"}];
let sel=0,cmd=false,filtered=[];
function clock(){const d=new Date();let h=d.getHours(),m=d.getMinutes();const ap=h<12?"am":"pm";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+ap}
function parse(t){let text=t,chips=[];const low=t.toLowerCase();
  const days=["today","tomorrow","tonight","monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
  for(const d of days){if(new RegExp("\\b"+d+"\\b").test(low)){chips.push({k:"due",t:d[0].toUpperCase()+d.slice(1)});break}}
  if(/(^|\s)!(\s|$)|!$/.test(t)){chips.push({k:"pri",t:"! Priority"});text=text.replace(/!/g,"")}
  const tag=t.match(/#(\w+)/);if(tag){chips.push({k:"tag",t:"# "+tag[1]});text=text.replace(/#\w+/,"")}
  return{text:text.replace(/\s{2,}/g," ").trim()||t,chips}}
function setMode(c){cmd=c;bar.classList.toggle("cmd",c);mode.classList.toggle("cmd",c);mode.textContent=c?"Command":"Capture";lead.textContent=c?"/":"+";
  palette.classList.toggle("on",c);hintrow.style.display=c?"none":"block"}
function renderPalette(q){filtered=CMDS.filter(c=>c.t.toLowerCase().includes(q.toLowerCase()));sel=0;palette.innerHTML="";
  if(!filtered.length){palette.innerHTML='<div class="pnone">no command — press ↵ to capture “'+q+'” as a note</div>';return}
  filtered.forEach((c,idx)=>{const d=document.createElement("div");d.className="ci"+(idx===sel?" sel":"");
    d.innerHTML=`<span class="ig">${c.i}</span> ${c.t}<span class="tagx">${c.x}</span>`;
    d.onmousemove=()=>{sel=idx;paintSel()};d.onclick=()=>runCmd(c);palette.appendChild(d)})}
function paintSel(){[...palette.querySelectorAll(".ci")].forEach((e,i)=>e.classList.toggle("sel",i===sel))}
function showDetect(v){detect.innerHTML="";const p=parse(v);if(!p.chips.length)return;
  const l=document.createElement("span");l.className="lead";l.textContent="detected:";detect.appendChild(l);
  p.chips.forEach(c=>{const s=document.createElement("span");s.className="chip "+c.k;s.textContent=c.t;detect.appendChild(s)})}
function capture(){const raw=inp.value.trim();if(!raw)return;const p=parse(raw);
  const em=document.getElementById("empty");if(em)em.remove();
  if(!recent.querySelector(".lbl")){const l=document.createElement("div");l.className="lbl";l.textContent="Recently captured";recent.prepend(l)}
  const row=document.createElement("div");row.className="li fresh";
  row.innerHTML='<span class="d"></span><div style="flex:1"><div class="t"></div></div><span class="time">'+clock()+'</span>';
  row.querySelector(".t").textContent=p.text;
  if(p.chips.length){const c=document.createElement("div");c.style.cssText="margin-top:6px;display:flex;gap:5px";
    p.chips.forEach(ch=>{const s=document.createElement("span");s.className="chip "+ch.k;s.textContent=ch.t;c.appendChild(s)});row.querySelector("div[style]").appendChild(c)}
  recent.querySelector(".lbl").after(row);inp.value="";detect.innerHTML="";flash("Captured ✓")}
function runCmd(c){setMode(false);inp.value="";detect.innerHTML="";flash(c.t.replace("…","")+" ✓")}
inp.addEventListener("input",()=>{const v=inp.value;
  if(v.startsWith("/")){setMode(true);renderPalette(v.slice(1))}
  else{if(cmd)setMode(false);showDetect(v.trim())}});
inp.addEventListener("keydown",e=>{
  if(cmd){
    if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(sel+1,filtered.length-1);paintSel()}
    else if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(sel-1,0);paintSel()}
    else if(e.key==="Enter"){e.preventDefault();if(filtered.length)runCmd(filtered[sel]);else{inp.value=inp.value.slice(1);setMode(false);capture()}}
    else if(e.key==="Escape"){inp.value="";setMode(false);detect.innerHTML=""}
  }else{
    if(e.key==="Enter"){e.preventDefault();capture()}
    if(e.key==="Escape"){inp.value="";detect.innerHTML=""}
  }});
let ft;function flash(msg){const f=document.getElementById("flash");f.textContent=msg;f.classList.add("on");clearTimeout(ft);ft=setTimeout(()=>f.classList.remove("on"),1100)}
inp.focus();
</script>
</body></html>
