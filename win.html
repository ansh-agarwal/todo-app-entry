<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F3F3F3"><title>Notes · Windows (Fluent)</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="./note-base.css">
<style>
:root{--bg:#F3F3F3;--ink:#1B1B1B;--ink-soft:#5C5C5C;--ink-faint:#9A9A9A;--rule:#E5E5E5;--rule-2:#EDEDED;
  --cbrule:#8A8A8A;--accent:#0067C0;--accent-soft:#EAF2FB;--on-accent:#fff;--cb-radius:4px;--title:21px;--body:15px;
  --btn:#0067C0;--btn-ink:#fff;--btn-r:5px;--fmt-bg:#FBFBFB;
  --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,Roboto,sans-serif;
  --mono:"Cascadia Code",Consolas,ui-monospace,monospace}
body{background:var(--bg)}
.wrap{background:#FBFBFB;border:1px solid var(--rule);border-radius:8px;margin-top:0;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.top{background:#FBFBFB;border-radius:8px 8px 0 0}
.doc{background:#FBFBFB}
.blk .mk.cb{border-radius:4px;border-width:1.2px;width:18px;height:18px}
.blk .mk.cb:hover{background:#EDEDED}
.blk.done .mk.cb:hover{background:var(--accent)}
.blk.done .mk.cb{animation:none}
.blk.tt .btx{font-weight:600}
.divider{background:var(--rule)}
.bar{background:#F9F9F9;border-top:1px solid var(--rule);border-radius:0 0 8px 8px}
.fmt{border:1px solid #E0E0E0;border-radius:5px;background:#FBFBFB}
.fmt:hover{background:#F0F0F0;border-color:#C7C7C7;color:var(--ink)}
.new{background:var(--accent);color:#fff;border-radius:5px;font-weight:600}
.new:hover{background:#0058A8}
.blk .btx:focus{outline:none}
</style></head>
<body>
<div class="wrap">
  <div class="top"><span class="date" id="date"></span><span class="vtag">Windows · v11</span><a href="./platform.html">platforms ↗</a></div>
  <div class="doc" id="doc"></div>
  <div class="bar"><button class="fmt" id="bBul" title="Bullet">•</button><button class="fmt" id="bTask" title="Task">☐</button><button class="new" id="bNew">＋ New</button></div>
</div>
<script src="./note.js"></script>
</body></html>
