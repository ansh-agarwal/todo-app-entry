<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<title>Chuckle · the list, already assigned</title>
<!--
  Chuckle — sorting as a LIST, with every choice already made. 2026-08-16.

  Anshul: "I want this in a list view, selections already made, user can go and
  update these." So: no deck, no one-at-a-time. Open the brain and the whole pile is
  there, each thought already carrying a list. You skim, fix the wrong ones, commit.

  Held constant across all four:
    - the same nine thoughts, the same nine pre-made choices (two of them deliberately wrong)
    - nothing is committed until you press the button — leaving without pressing changes nothing
    - a row you have changed is marked, so you can see your own edits
    - one undo puts the whole batch back
  Only the way you UPDATE a row differs. That is the whole question here.
-->
<style>
:root{
  --accent:#0A84FF; --accent-soft:#E9F2FF; --accent-ink:#0060DF;
  --bg:#F2F2F7; --surface:#FFFFFF;
  --ink:#1C1C1E; --ink-soft:#3C3C4399; --ink-faint:#3C3C434D; --ink-mid:#6E6E73;
  --rule:#3C3C431F; --good:#34C759; --warn:#FF3B30;
  --chrome:rgba(249,249,249,.86); --page:#E9E9EE;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --accent-soft:#0A84FF26; --accent-ink:#64B0FF;
    --bg:#000000; --surface:#1C1C1E;
    --ink:#FFFFFF; --ink-soft:#EBEBF599; --ink-faint:#EBEBF54D; --ink-mid:#98989F;
    --rule:#54545899; --chrome:rgba(28,28,30,.82); --page:#111114;
    --shadow:0 1px 2px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;
     -webkit-font-smoothing:antialiased;padding-bottom:60px}

.top{position:sticky;top:0;z-index:50;background:var(--chrome);backdrop-filter:saturate(180%) blur(20px);
     -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--rule);padding:14px 16px 12px}
.top .wrap{max-width:1180px;margin:0 auto}
.eyebrow{font-size:12.5px;font-weight:650;color:var(--ink-mid);letter-spacing:.02em;text-transform:uppercase}
h1{font-size:25px;font-weight:700;letter-spacing:-.022em;margin:2px 0 3px}
.lede{font-size:14.5px;color:var(--ink-mid);max-width:66ch}
.lede a{color:var(--accent);text-decoration:none;font-weight:650}
.segs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.seg{border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;font-weight:650;
     padding:8px 13px;border-radius:11px;cursor:pointer;box-shadow:var(--shadow);letter-spacing:-.005em}
.seg.on{background:var(--accent);color:#fff}

.stage{max-width:1180px;margin:22px auto 0;padding:0 16px}
.variant{display:none}
.variant.on{display:grid;grid-template-columns:1fr;gap:22px;justify-items:center}
@media (min-width:900px){ .variant.on{grid-template-columns:390px 1fr;align-items:start;justify-items:start} }

/* ---------- phone ---------- */
.phone{width:min(390px,100%);height:760px;background:var(--bg);border-radius:34px;position:relative;
       overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.10),0 26px 60px rgba(0,0,0,.18);
       border:.5px solid var(--rule);display:flex;flex-direction:column}
.sbar{height:34px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;
      padding:0 20px 3px;font-size:12.5px;font-weight:650}
.sbar .dots{letter-spacing:2px;opacity:.7}
.cap{flex:1;overflow:hidden;padding:8px 20px 0;position:relative}
.cap .cdate{font-size:12.5px;font-weight:650;color:var(--ink-mid);padding-top:4px}
.cap h2{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:6px 0 6px}
.cap p{font-size:16px;margin-bottom:4px}
.cap p.b{padding-left:16px;position:relative}
.cap p.b::before{content:'•';position:absolute;left:2px;color:var(--ink-faint)}
.cap .caret{display:inline-block;width:2px;height:18px;background:var(--accent);vertical-align:-3px;
            animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cap .fade{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,var(--bg))}
.bar{flex:0 0 auto;height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;
     background:var(--chrome);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
     border-top:.5px solid var(--rule)}
.bar .tool{color:var(--ink-soft);font-size:16px}
.bar .tool.nw{font-size:13.5px;font-weight:650;color:var(--accent)}

/* ---------- brain ---------- */
.brain{margin-left:auto;display:flex;align-items:center;gap:6px;border:0;background:none;cursor:pointer;padding:4px 2px}
.brain svg{overflow:visible}
.brain .bfill{transition:y .55s cubic-bezier(.3,.8,.3,1),fill .5s}
.brain .bmouth{transition:d .35s ease,stroke .5s}
.brain .bcount{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.brain.shake svg{animation:bshake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes bshake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}
                  30%,50%,70%{transform:translateX(-3px)}40%,60%{transform:translateX(3px)}}
.brain.relief svg{animation:brelief .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes brelief{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}

/* ---------- sheet ---------- */
.sheet{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;
       transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:none}
.shead{flex:0 0 auto;padding:16px 18px 10px;display:flex;align-items:flex-start;gap:10px;
       border-bottom:.5px solid var(--rule)}
.shead .stitle{flex:1}
.shead h3{font-size:19px;font-weight:700;letter-spacing:-.02em}
.shead .ssub{font-size:12.5px;color:var(--ink-mid);margin-top:1px}
.shead .x{border:0;background:none;font:inherit;font-size:15px;font-weight:650;color:var(--accent);cursor:pointer}
.sbody{flex:1;overflow-y:auto;padding:12px 14px 18px;position:relative}
.sfoot{flex:0 0 auto;padding:10px 14px 12px;border-top:.5px solid var(--rule);background:var(--chrome);
       backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

.btn{width:100%;border:0;border-radius:13px;padding:13px;font:inherit;font-size:15.5px;font-weight:650;
     cursor:pointer;background:var(--accent);color:#fff;letter-spacing:-.005em;
     display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn.sm{padding:10px;font-size:14px}
.brow{display:flex;gap:8px}
.foothint{font-size:11.5px;color:var(--ink-mid);text-align:center;margin-top:7px}

/* ---------- the list ---------- */
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:11px}
.it{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-bottom:.5px solid var(--rule);
    cursor:pointer;position:relative;transition:background .15s}
.it:last-child{border-bottom:0}
.it:hover{background:var(--accent-soft)}
.it .txt{flex:1;font-size:14.5px;letter-spacing:-.005em;min-width:0}
.it .why{font-size:11px;color:var(--ink-faint);margin-top:2px}
.it.changed{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.it.changed::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.it.out{opacity:0;transform:translateX(24px);transition:opacity .22s,transform .24s}

/* the destination pill */
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:.5px solid var(--rule);
      background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px;font-weight:650;
      padding:5px 9px;border-radius:9px;cursor:pointer;white-space:nowrap;margin-top:1px}
.pill:hover{border-color:var(--accent);color:var(--accent-ink)}
.pill .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.pill .cv{font-size:9px;opacity:.5;margin-left:-1px}
.pill.edited{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:7px;border:.5px solid var(--rule);background:var(--surface);
      color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:11px;
      cursor:pointer;letter-spacing:-.005em}
.chip:active{transform:scale(.96)}
.chip .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.chip.on{border-color:var(--accent);border-width:1.5px;background:var(--accent-soft);color:var(--accent-ink)}
.chip.sm{font-size:12.5px;padding:6px 10px;border-radius:9px}

/* the modal picker (variants 1, 3, 4) */
.scrim{position:absolute;inset:0;z-index:24;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;
       transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.pop{position:absolute;left:10px;right:10px;bottom:10px;z-index:25;background:var(--bg);border-radius:18px;
     padding:15px 15px 14px;transform:translateY(20px);opacity:0;pointer-events:none;
     transition:transform .24s cubic-bezier(.32,.72,0,1),opacity .18s;box-shadow:0 -6px 40px rgba(0,0,0,.22)}
.pop.on{transform:none;opacity:1;pointer-events:auto}
.pop h5{font-size:12px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em}
.pop .pq{font-size:15px;font-weight:600;margin:4px 0 12px;letter-spacing:-.01em}

/* inline unfold (variant 2) */
.unfold{max-height:0;overflow:hidden;transition:max-height .26s cubic-bezier(.32,.72,0,1)}
.unfold.on{max-height:220px}
.unfold .inner{padding:2px 12px 12px}

/* groups (variant 3) */
.ghead{display:flex;align-items:center;gap:8px;margin:2px 4px 6px}
.ghead .d{width:9px;height:9px;border-radius:50%}
.ghead .gn{font-size:13px;font-weight:700;letter-spacing:-.005em}
.ghead .gc{font-size:11.5px;color:var(--ink-faint);font-weight:650}

/* selection (variant 4) */
.it .tick{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--ink-faint);flex:0 0 auto;
          margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.it.sel .tick{background:var(--accent);border-color:var(--accent)}
.it.sel{background:var(--accent-soft)}

/* summary strip */
.sum{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.sum .s{display:inline-flex;align-items:center;gap:6px;background:var(--surface);box-shadow:var(--shadow);
        border-radius:9px;padding:5px 9px;font-size:12px;font-weight:650}
.sum .s .d{width:7px;height:7px;border-radius:50%}
.sum .s b{color:var(--ink-faint);font-weight:700}

/* snack */
.snack{position:absolute;left:14px;right:14px;bottom:78px;z-index:30;background:var(--ink);color:var(--bg);
       border-radius:13px;padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:13.5px;
       font-weight:600;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .18s,transform .22s}
.snack.on{opacity:1;transform:none;pointer-events:auto}
.snack .u{margin-left:auto;border:0;background:none;color:#4DA3FF;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
@media (prefers-color-scheme:dark){ .snack .u{color:#0A84FF} }

.done{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
      text-align:center;gap:6px;padding:0 34px}
.done .big{font-size:44px}
.done h4{font-size:19px;font-weight:700;letter-spacing:-.02em}
.done p{font-size:14px;color:var(--ink-mid)}

/* notes */
.notes{max-width:560px}
.notes h3{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px}
.notes .kicker{font-size:12.5px;font-weight:650;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.notes p{color:var(--ink-soft);margin:9px 0;font-size:15px}
.notes ul{margin:9px 0;list-style:none}
.notes li{position:relative;padding-left:19px;margin-bottom:7px;color:var(--ink-soft);font-size:14.5px}
.notes li::before{content:'';position:absolute;left:3px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--ink-faint)}
.notes li.plus::before{background:var(--good)}
.notes li.minus::before{background:var(--warn)}
.cost{display:flex;gap:8px;margin:12px 0 0;flex-wrap:wrap}
.cost div{background:var(--surface);box-shadow:var(--shadow);border-radius:11px;padding:9px 12px;font-size:13px;font-weight:650}
.cost div span{display:block;font-size:11px;font-weight:650;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em}
.notes .verdict{margin-top:14px;background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);
                font-size:14.5px;color:var(--ink)}
.reset{margin-top:14px;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--ink-mid);
       font:inherit;font-size:13px;font-weight:650;padding:8px 13px;border-radius:11px;cursor:pointer}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="eyebrow">Chuckle · explorations</div>
  <h1>The list, already assigned</h1>
  <div class="lede">Open the brain and the whole pile is there, every thought already carrying a list.
    Skim, fix the ones that are wrong, commit. Two of the nine are deliberately mis-assigned so you can
    feel what correcting costs. <a href="sort-deck.html">← the deck versions</a></div>
  <div class="segs" id="segs"></div>
</div></div>

<div class="stage" id="stage"></div>

<script>
/* ===================== shared model ===================== */
const LISTS = [
  { id:'today',    name:'Today',    c:'#0A84FF' },
  { id:'work',     name:'Work',     c:'#5E5CE6' },
  { id:'smebi',    name:'SME BI',   c:'#30B0C7' },
  { id:'career',   name:'Career',   c:'#FF9F0A' },
  { id:'trading',  name:'Trading',  c:'#34C759' },
  { id:'health',   name:'Health',   c:'#FF375F' },
  { id:'personal', name:'Personal', c:'#AF52DE' },
  { id:'someday',  name:'Someday',  c:'#8E8E93' }
];
const L = id => LISTS.find(l => l.id === id);

/* p7 and p8 are guessed WRONG on purpose — a list of nine perfect guesses would
   flatter every one of these designs equally and tell us nothing. */
const PILE = [
  { id:'p1', t:'ask Saloni where the row-level policy review landed',    guess:'work',     why:'a colleague, and a review' },
  { id:'p2', t:'TSM backtest — check the Sharpe held after costs',        guess:'trading',  why:'"backtest", "Sharpe"' },
  { id:'p3', t:'book Delhi hotel, ceiling ₹8,000 for Fri/Sat',           guess:'personal', why:'travel, and a price ceiling' },
  { id:'p4', t:'STAR story: the zero-downtime migration, 40M rows',      guess:'career',   why:'"STAR story"' },
  { id:'p5', t:'wrist stretches keep getting skipped — move to morning',  guess:'health',   why:'an exercise you already track' },
  { id:'p6', t:'alert copy: under 200 characters, one number, no jargon', guess:'smebi',    why:'"alert copy" — the pilot spec' },
  { id:'p7', t:'idea: the brain icon should be where sorting happens',    guess:'work',     why:'weak guess — no strong signal' },
  { id:'p8', t:'renew the domain before it lapses',                      guess:'personal', why:'weak guess — admin, with a deadline' },
  { id:'p9', t:"Pooja's new glasses — order the second pair",            guess:'personal', why:'family, and a purchase' }
];

const VARIANTS = [
  { key:'1', tab:'1 · Pill', title:'A pill on every row',
    sub:'Tap the pill, pick from a sheet. The row never moves.',
    kicker:'Variant 1',
    lead:'Nine rows in capture order, each with its list as a small pill on the right. Tap a pill and a picker rises over the bottom of the screen; choose, and the pill changes in place. The row stays exactly where it was, so you never lose your place in the skim.',
    cost:[['Skim','1 screen'],['Fix one','2 taps'],['Commit','1 tap']],
    pros:['Reads top to bottom in one pass. The pills line up on the right, so a wrong one stands out.',
          'Nothing reorders under you while you work. You can go down the list once and be done.',
          'The picker is a sheet, so twenty lists is a scroll — the row layout never changes.'],
    cons:['Two taps per correction, and a sheet covers the list while you choose.',
          'The pill is small. On a phone that is a real aim, especially one-handed.',
          'You cannot see the resulting shape — nine rows tell you nothing about which list is filling up.'],
    verdict:'<b>The one to ship.</b> It is the most boring of the four and that is the point: predictable, one pass, nothing moves.' },

  { key:'2', tab:'2 · Unfold', title:'Tap the row, chips unfold',
    sub:'No overlay. The lists open underneath the thought itself.',
    kicker:'Variant 2',
    lead:'Same list of rows, but tapping one opens the lists inline, right under that thought. Pick and it folds shut. Nothing ever covers the screen, and the thought you are deciding about stays visible while you decide.',
    cost:[['Skim','1 screen'],['Fix one','2 taps'],['Commit','1 tap']],
    pros:['The thought and its options are on screen together. That is the single most useful thing here.',
          'No overlay, no scrim, no modal to dismiss. The whole flow stays in one surface.',
          'Tapping anywhere on the row works, so there is no small target to aim at.'],
    cons:['The list jumps when a row unfolds. Rows below shift down, which is exactly what you do not want mid-skim.',
          'Eight chips inline is a big block. Past ten lists this becomes an inner scroll, which is horrible.',
          'Easy to open a row by accident while scrolling.'],
    verdict:'<b>Better feel, worse behaviour.</b> Worth revisiting if the chip block can be held to one line.' },

  { key:'3', tab:'3 · Grouped', title:'Grouped by list',
    sub:'Not nine rows — the shape they make.',
    kicker:'Variant 3',
    lead:'The same nine thoughts, but stacked under the list each one is going to. You are not reading a queue, you are reading a decision: four things went to Personal today, one to Career. Tap any thought to move it, and it visibly leaves one group and joins another.',
    cost:[['Skim','by shape'],['Fix one','2 taps + a jump'],['Commit','1 tap']],
    pros:['The only one that shows you something you did not already know — which parts of your life ate today.',
          'Wrong assignments are easier to spot in context. A hotel booking sitting under Career is obvious.',
          'Moving something is genuinely satisfying: it leaves the old group and lands in the new one.'],
    cons:['Rows move while you work. Fix one and the list reflows under your thumb — the worst property of the four.',
          'Capture order is gone, and capture order is how you remember what you meant.',
          'More vertical space per thought, so more scrolling for the same nine items.'],
    verdict:'<b>A great review screen, a poor edit screen.</b> Best use is as a read-only confirmation step after variant 1.' },

  { key:'4', tab:'4 · Bulk', title:'Rows plus bulk reassign',
    sub:'Fix one with the pill. Fix five at once by selecting them.',
    kicker:'Variant 4',
    lead:'Variant 1, plus selection. The pill still works for a single correction. But tick several rows and the footer turns into a list picker that moves all of them at once — which is the shape of the real problem, because guesses tend to be wrong in batches.',
    cost:[['Skim','1 screen'],['Fix one','2 taps'],['Fix five','6 taps']],
    pros:['The only one that handles the actual failure mode: a bad rule that mis-files four related thoughts.',
          'Costs nothing when you do not use it — untouched, it behaves exactly like variant 1.',
          'The footer changing to a picker makes the batch action impossible to miss.'],
    cons:['Two ways to do one thing. The pill and the tick overlap in purpose and that is a real confusion.',
          'Tap-to-select fights tap-to-open. Whichever you choose, someone gets the wrong one.',
          'It is more machinery for a pile of nine. Justified at forty, not here.'],
    verdict:'<b>Right idea, wrong time.</b> Add selection when piles get big; do not carry it on day one.' }
];

/* ===================== state ===================== */
const S = {};
VARIANTS.forEach(v => S[v.key] = fresh());
function fresh(){
  const a = {}; PILE.forEach(p => a[p.id] = p.guess);
  return { items: PILE.map(p => ({...p})), assign:a, edited:new Set(), sel:new Set(),
           open:false, pickFor:null, unfolded:null, filed:null };
}

/* ===================== markup ===================== */
const BP = 'M14.2 5.6c-2.6 0-4.6 1.7-5 4-2.2.5-3.8 2.4-3.8 4.7 0 .9.2 1.7.7 2.4-1.2 1-2 2.5-2 4.2 0 2 1 3.7 2.6 4.7-.1.4-.2.9-.2 1.4 0 3 2.5 5.4 5.6 5.4 1 0 2-.3 2.8-.8.8 1.6 2.5 2.7 4.5 2.7s3.7-1.1 4.5-2.7c.8.5 1.8.8 2.8.8 3.1 0 5.6-2.4 5.6-5.4 0-.5-.1-1-.2-1.4 1.6-1 2.6-2.7 2.6-4.7 0-1.7-.8-3.2-2-4.2.5-.7.7-1.5.7-2.4 0-2.3-1.6-4.2-3.8-4.7-.4-2.3-2.4-4-5-4-1.7 0-3.2.8-4.1 2-.9-1.2-2.4-2-4.1-2z';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function brainHTML(k){
  return `<button class="brain" id="brain-${k}" title="Unsorted — tap to sort">
    <svg width="27" height="27" viewBox="0 0 40 40" aria-hidden="true">
      <defs><clipPath id="clip-${k}"><path d="${BP}"/></clipPath></defs>
      <g clip-path="url(#clip-${k})"><rect class="bfill" id="bfill-${k}" x="0" y="40" width="40" height="40"/></g>
      <path d="${BP}" id="bout-${k}" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55"/>
      <path d="M20 8.4v22.4M20 14.5c-2.6 0-4.2 1.4-4.2 3M20 20.4c2.8 0 4.6 1.5 4.6 3.3" id="bdet-${k}"
            fill="none" stroke="currentColor" stroke-width="1.3" opacity=".32" stroke-linecap="round"/>
      <path class="bmouth" id="bmouth-${k}" fill="none" stroke-width="1.6" stroke-linecap="round"/>
    </svg><span class="bcount" id="bcount-${k}">0</span></button>`;
}
function phoneHTML(v){
  const k = v.key;
  return `<div class="phone" id="phone-${k}">
    <div class="sbar"><span>9:41</span><span class="dots">▮▮▮</span></div>
    <div class="cap">
      <div class="cdate">Capture · Sunday, August 16</div>
      <h2>${esc("Pooja's new glasses")}</h2><p>order the second pair<span class="caret"></span></p>
      <h2 style="margin-top:16px">renew the domain</h2><p class="b">before it lapses</p>
      <div class="fade"></div>
    </div>
    <div class="bar"><span class="tool">•</span><span class="tool">☐</span><span class="tool nw">＋ New</span>
      ${brainHTML(k)}</div>
    <div class="snack" id="snack-${k}"><span id="snacktext-${k}"></span><button class="u" id="undo-${k}">Undo</button></div>
    <div class="sheet" id="sheet-${k}">
      <div class="shead"><div class="stitle"><h3>${esc(v.title)}</h3><div class="ssub">${esc(v.sub)}</div></div>
        <button class="x" id="close-${k}">Close</button></div>
      <div class="sbody" id="body-${k}"></div>
      <div class="sfoot" id="foot-${k}"></div>
      <div class="scrim" id="scrim-${k}"></div>
      <div class="pop" id="pop-${k}"></div>
    </div>
  </div>`;
}
function notesHTML(v){
  return `<div class="notes">
    <div class="kicker">${esc(v.kicker)}</div><h3>${esc(v.title)}</h3>
    <p>${esc(v.lead)}</p>
    <div class="cost">${v.cost.map(([a,b]) => `<div><span>${esc(a)}</span>${esc(b)}</div>`).join('')}</div>
    <ul>${v.pros.map(p => `<li class="plus">${esc(p)}</li>`).join('')}
        ${v.cons.map(c => `<li class="minus">${esc(c)}</li>`).join('')}</ul>
    <div class="verdict">${v.verdict}</div>
    <button class="reset" data-reset="${v.key}">↺ Reset this pile</button></div>`;
}

document.getElementById('segs').innerHTML =
  VARIANTS.map((v,i) => `<button class="seg${i===0?' on':''}" data-v="${v.key}">${esc(v.tab)}</button>`).join('');
document.getElementById('stage').innerHTML =
  VARIANTS.map((v,i) => `<section class="variant${i===0?' on':''}" id="var-${v.key}">${phoneHTML(v)}${notesHTML(v)}</section>`).join('');

document.getElementById('segs').onclick = e => {
  const b = e.target.closest('[data-v]'); if(!b) return;
  document.querySelectorAll('.seg').forEach(s => s.classList.toggle('on', s === b));
  document.querySelectorAll('.variant').forEach(s => s.classList.toggle('on', s.id === 'var-' + b.dataset.v));
};
document.getElementById('stage').addEventListener('click', e => {
  const b = e.target.closest('[data-reset]'); if(!b) return;
  const k = b.dataset.reset, o = S[k].open; S[k] = fresh(); S[k].open = o; render(k);
});

/* ===================== brain ===================== */
const BRAIN_FULL = 12;
const STATES = [
  { at:.75, fill:'#FF453A', mouth:'M16.4 27.6q3.6 -3 7.2 0' },
  { at:.45, fill:'#FF9F0A', mouth:'M16.4 27.2q3.6 -1.4 7.2 0' },
  { at:.18, fill:'#FFD60A', mouth:'M16.4 26.8h7.2' },
  { at:-1,  fill:'#34C759', mouth:'M16.4 26.4q3.6 3 7.2 0' }
];
const prevN = {};
function renderBrain(k){
  const n = S[k].items.length, level = Math.min(1, n / BRAIN_FULL);
  const st = STATES.find(s => level > s.at) || STATES[STATES.length-1];
  const fillTop = 34 - level * 30, drowned = fillTop < 27;
  const $ = id => document.getElementById(id + '-' + k);
  $('bfill').setAttribute('y', String(fillTop)); $('bfill').setAttribute('fill', st.fill);
  $('bmouth').setAttribute('d', st.mouth);
  $('bmouth').setAttribute('stroke', drowned ? '#FFFFFF' : st.fill);
  $('bout').setAttribute('stroke', drowned ? '#FFFFFF' : 'currentColor');
  $('bdet').setAttribute('stroke', drowned ? '#FFFFFF' : 'currentColor');
  $('bcount').textContent = n; $('brain').style.color = st.fill;
  const el = $('brain');
  if(prevN[k] !== undefined && prevN[k] !== n){
    const kind = n > prevN[k] ? 'shake' : 'relief';
    el.classList.remove('shake','relief'); void el.offsetWidth; el.classList.add(kind);
    setTimeout(() => el.classList.remove(kind), 620);
  }
  prevN[k] = n;
}

/* ===================== actions ===================== */
function setList(k, itemId, listId){
  const st = S[k], p = PILE.find(x => x.id === itemId);
  st.assign[itemId] = listId;
  listId === p.guess ? st.edited.delete(itemId) : st.edited.add(itemId);
}
function commit(k){
  const st = S[k];
  const spread = new Set(st.items.map(i => st.assign[i.id]));
  st.filed = { items: st.items.slice(), assign: {...st.assign}, edited: new Set(st.edited) };
  const n = st.items.length;
  st.items = []; st.sel.clear(); st.unfolded = null; closePop(k);
  snack(k, `${n} filed across ${spread.size} ${spread.size === 1 ? 'list' : 'lists'}`);
  render(k);
}
function undo(k){
  const st = S[k]; if(!st.filed) return;
  st.items = st.filed.items; st.assign = st.filed.assign; st.edited = st.filed.edited;
  st.filed = null; hideSnack(k); render(k);
}
const snackT = {};
function snack(k, msg){
  const el = document.getElementById('snack-' + k);
  document.getElementById('snacktext-' + k).textContent = msg;
  el.classList.add('on');
  clearTimeout(snackT[k]); snackT[k] = setTimeout(() => el.classList.remove('on'), 3600);
}
function hideSnack(k){ document.getElementById('snack-' + k).classList.remove('on'); }

/* the bottom picker, shared by 1, 3 and 4 */
function openPop(k, title, current, onPick){
  const st = S[k];
  const pop = document.getElementById('pop-' + k), scrim = document.getElementById('scrim-' + k);
  pop.innerHTML = `<h5>Move to</h5><div class="pq">${esc(title)}</div>
    <div class="chips">${LISTS.map(l => `<button class="chip${l.id===current?' on':''}" data-l="${l.id}">
      <span class="d" style="background:${l.c}"></span>${esc(l.name)}</button>`).join('')}</div>`;
  pop.querySelectorAll('[data-l]').forEach(c => c.onclick = () => { closePop(k); onPick(c.dataset.l); });
  pop.classList.add('on'); scrim.classList.add('on');
  scrim.onclick = () => { st.pickFor = null; closePop(k); };
}
function closePop(k){
  document.getElementById('pop-' + k).classList.remove('on');
  document.getElementById('scrim-' + k).classList.remove('on');
}

/* ===================== wiring ===================== */
VARIANTS.forEach(v => {
  const k = v.key;
  document.getElementById('brain-' + k).onclick = () => {
    S[k].open = true; document.getElementById('sheet-' + k).classList.add('on'); render(k);
  };
  document.getElementById('close-' + k).onclick = () => {
    S[k].open = false; closePop(k); document.getElementById('sheet-' + k).classList.remove('on');
  };
  document.getElementById('undo-' + k).onclick = () => undo(k);
  render(k);
});

function render(k){
  renderBrain(k);
  const body = document.getElementById('body-' + k), foot = document.getElementById('foot-' + k), st = S[k];
  if(!st.items.length){
    const n = st.filed ? st.filed.items.length : 0;
    body.innerHTML = `<div class="done"><div class="big">🧠</div><h4>Clear head</h4>
      <p>All ${n} thoughts filed. Nothing sitting in Unsorted.</p></div>`;
    foot.innerHTML = `<button class="btn ghost" id="again-${k}">↺ Run it again</button>`;
    document.getElementById('again-' + k).onclick = () => {
      const o = st.open; S[k] = fresh(); S[k].open = o; render(k);
    };
    return;
  }
  ({'1':r1, '2':r2, '3':r3, '4':r4})[k](k, body, foot);
}

/* the strip that says where the pile is going */
function sumHTML(k){
  const st = S[k], by = {};
  st.items.forEach(i => { const l = st.assign[i.id]; by[l] = (by[l]||0) + 1; });
  return `<div class="sum">${LISTS.filter(l => by[l.id]).map(l =>
    `<span class="s"><span class="d" style="background:${l.c}"></span>${esc(l.name)} <b>${by[l.id]}</b></span>`).join('')}</div>`;
}
function pillHTML(k, id){
  const st = S[k], l = L(st.assign[id]);
  return `<button class="pill${st.edited.has(id)?' edited':''}" data-pill="${id}">
    <span class="d" style="background:${l.c}"></span>${esc(l.name)}<span class="cv">▾</span></button>`;
}
function commitFoot(k){
  const st = S[k], n = st.items.length, e = st.edited.size;
  return `<button class="btn" id="commit-${k}">File all ${n}</button>
    <div class="foothint">${e ? `${e} changed by hand · ` : ''}nothing moves until you press it</div>`;
}
function wireCommit(k){
  document.getElementById('commit-' + k).onclick = () => {
    document.querySelectorAll('#body-' + k + ' .it').forEach(r => r.classList.add('out'));
    setTimeout(() => commit(k), 200);
  };
}

/* ---------- 1 · pill → sheet ---------- */
function r1(k, body, foot){
  const st = S[k];
  body.innerHTML = sumHTML(k) + `<div class="card">${st.items.map(i => `
    <div class="it${st.edited.has(i.id)?' changed':''}" data-i="${i.id}">
      <div class="txt">${esc(i.t)}</div>${pillHTML(k, i.id)}</div>`).join('')}</div>`;
  foot.innerHTML = commitFoot(k);
  const pick = id => openPop(k, PILE.find(p => p.id === id).t, st.assign[id],
                             l => { setList(k, id, l); render(k); });
  body.querySelectorAll('[data-pill]').forEach(b => b.onclick = e => { e.stopPropagation(); pick(b.dataset.pill); });
  body.querySelectorAll('[data-i]').forEach(r => r.onclick = () => pick(r.dataset.i));
  wireCommit(k);
}

/* ---------- 2 · unfold in place ---------- */
function r2(k, body, foot){
  const st = S[k];
  body.innerHTML = sumHTML(k) + `<div class="card">${st.items.map(i => {
    const open = st.unfolded === i.id;
    return `<div class="it${st.edited.has(i.id)?' changed':''}" data-i="${i.id}">
        <div class="txt">${esc(i.t)}</div>${pillHTML(k, i.id)}</div>
      <div class="unfold${open?' on':''}" id="uf-${k}-${i.id}"><div class="inner">
        <div class="chips">${LISTS.map(l => `<button class="chip sm${l.id===st.assign[i.id]?' on':''}"
          data-set="${i.id}" data-l="${l.id}"><span class="d" style="background:${l.c}"></span>${esc(l.name)}</button>`).join('')}</div>
      </div></div>`;
  }).join('')}</div>`;
  foot.innerHTML = commitFoot(k);
  const toggle = id => { st.unfolded = st.unfolded === id ? null : id; render(k); };
  body.querySelectorAll('[data-i]').forEach(r => r.onclick = () => toggle(r.dataset.i));
  body.querySelectorAll('[data-pill]').forEach(b => b.onclick = e => { e.stopPropagation(); toggle(b.dataset.pill); });
  body.querySelectorAll('[data-set]').forEach(c => c.onclick = () => {
    setList(k, c.dataset.set, c.dataset.l); st.unfolded = null; render(k);
  });
  wireCommit(k);
}

/* ---------- 3 · grouped by list ---------- */
function r3(k, body, foot){
  const st = S[k], by = {};
  st.items.forEach(i => { const l = st.assign[i.id]; (by[l] = by[l] || []).push(i); });
  body.innerHTML = LISTS.filter(l => by[l.id]).map(l => `
    <div style="margin-bottom:13px">
      <div class="ghead"><span class="d" style="background:${l.c}"></span>
        <span class="gn">${esc(l.name)}</span><span class="gc">${by[l.id].length}</span></div>
      <div class="card">${by[l.id].map(i => `
        <div class="it${st.edited.has(i.id)?' changed':''}" data-i="${i.id}">
          <div class="txt">${esc(i.t)}</div>
          <span class="pill" data-pill="${i.id}">Move<span class="cv">▾</span></span></div>`).join('')}</div>
    </div>`).join('');
  foot.innerHTML = commitFoot(k);
  const pick = id => openPop(k, PILE.find(p => p.id === id).t, st.assign[id],
                             l => { setList(k, id, l); render(k); });
  body.querySelectorAll('[data-pill]').forEach(b => b.onclick = e => { e.stopPropagation(); pick(b.dataset.pill); });
  body.querySelectorAll('[data-i]').forEach(r => r.onclick = () => pick(r.dataset.i));
  wireCommit(k);
}

/* ---------- 4 · rows plus bulk reassign ---------- */
function r4(k, body, foot){
  const st = S[k], n = st.sel.size;
  body.innerHTML = sumHTML(k) + `<div class="card">${st.items.map(i => `
    <div class="it${st.edited.has(i.id)?' changed':''}${st.sel.has(i.id)?' sel':''}" data-i="${i.id}">
      <div class="tick">${st.sel.has(i.id)?'✓':''}</div>
      <div class="txt">${esc(i.t)}</div>${pillHTML(k, i.id)}</div>`).join('')}</div>`;
  foot.innerHTML = n
    ? `<div style="font-size:12px;font-weight:650;color:var(--ink-mid);margin:0 0 8px 3px">
         Move ${n} selected to…</div>
       <div class="chips">${LISTS.map(l => `<button class="chip sm" data-bulk="${l.id}">
         <span class="d" style="background:${l.c}"></span>${esc(l.name)}</button>`).join('')}</div>
       <button class="btn ghost sm" id="clear-${k}" style="margin-top:9px">Clear selection</button>`
    : commitFoot(k);
  body.querySelectorAll('[data-pill]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const id = b.dataset.pill;
    openPop(k, PILE.find(p => p.id === id).t, st.assign[id], l => { setList(k, id, l); render(k); });
  });
  body.querySelectorAll('[data-i]').forEach(r => r.onclick = () => {
    const id = r.dataset.i;
    st.sel.has(id) ? st.sel.delete(id) : st.sel.add(id);
    render(k);
  });
  foot.querySelectorAll('[data-bulk]').forEach(c => c.onclick = () => {
    st.sel.forEach(id => setList(k, id, c.dataset.bulk));
    snack(k, `${st.sel.size} moved to ${L(c.dataset.bulk).name}`);
    st.sel.clear(); render(k);
  });
  if(n) document.getElementById('clear-' + k).onclick = () => { st.sel.clear(); render(k); };
  else wireCommit(k);
}
</script>
</body></html>
