<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFFFFF"><title>Note to self — Lull</title>
<link rel="stylesheet" href="./app.css">
<style>
.thread{flex:1;overflow-y:auto;padding:14px 18px 8px;display:flex;flex-direction:column;gap:4px}
.divider{align-self:center;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);background:var(--rule-2);padding:3px 11px;border-radius:20px;margin:10px 0}
.sys{align-self:center;text-align:center;color:var(--ink-soft);font-family:var(--serif);font-style:italic;font-size:14px;max-width:34ch;margin:6px 0 10px;line-height:1.4}
.msg{align-self:flex-end;max-width:80%;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.bub{background:var(--accent);color:#fff;font-size:15px;line-height:1.4;padding:9px 13px;border-radius:17px 17px 5px 17px;word-break:break-word;animation:rise .25s ease}
.mchips{display:flex;gap:5px;margin-top:2px}
.mchips .chip{font-size:10.5px}
.mtime{font-size:10.5px;color:var(--ink-faint);padding-right:4px}
.composer{flex:0 0 auto;display:flex;gap:9px;align-items:center;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--rule)}
.composer input{flex:1;border:1px solid var(--rule);border-radius:22px;padding:11px 15px;outline:none;font-size:15px;font-family:var(--sans)}
.composer input:focus{border-color:var(--accent)}
.mic,.send{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;flex:0 0 auto;display:grid;place-items:center;font-size:16px}
.mic{background:var(--rule-2);color:var(--ink-soft)}.mic.rec{background:var(--amber);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,83,15,.4)}70%{box-shadow:0 0 0 12px rgba(180,83,15,0)}100%{box-shadow:0 0 0 0 rgba(180,83,15,0)}}
.send{background:var(--accent);color:#fff}
</style></head>
<body>
<div class="shell">
  <div class="top"><div class="mark g">◍</div><h1>Note to self</h1><span class="sub">just you</span>
    <a class="back" href="./finalists.html">finalists ↗</a></div>
  <div class="thread" id="thread">
    <div class="divider">Today</div>
    <div class="sys">Dump anything here — a task, a thought, a maybe. I'll keep it, and bring it up in tomorrow's brief.</div>
  </div>
  <div class="composer">
    <button class="mic" id="mic" title="Speak">🎙</button>
    <input id="inp" placeholder="Message yourself…" autocomplete="off">
    <button class="send" id="send">↑</button>
  </div>
</div>
<div class="flash" id="flash">Sent ✓</div>
<script>
const thread=document.getElementById("thread"),inp=document.getElementById("inp");
function clock(){const d=new Date();let h=d.getHours(),m=d.getMinutes();const ap=h<12?"am":"pm";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+ap}
function parse(t){let chips=[];const low=t.toLowerCase();
  const days=["today","tomorrow","tonight","monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
  for(const d of days){if(new RegExp("\\b"+d+"\\b").test(low)){chips.push({k:"due",t:d[0].toUpperCase()+d.slice(1)});break}}
  if(/(^|\s)!(\s|$)|!$/.test(t))chips.push({k:"pri",t:"!"});
  const tag=t.match(/#(\w+)/);if(tag)chips.push({k:"tag",t:"# "+tag[1]});
  return chips}
function send(){const v=inp.value.trim();if(!v)return;
  const m=document.createElement("div");m.className="msg";
  const b=document.createElement("div");b.className="bub";b.textContent=v;m.appendChild(b);
  const chips=parse(v);if(chips.length){const c=document.createElement("div");c.className="mchips";
    chips.forEach(ch=>{const s=document.createElement("span");s.className="chip "+ch.k;s.textContent=ch.t;c.appendChild(s)});m.appendChild(c)}
  const t=document.createElement("div");t.className="mtime";t.textContent=clock();m.appendChild(t);
  thread.appendChild(m);thread.scrollTop=thread.scrollHeight;inp.value="";flash()}
document.getElementById("send").onclick=send;
inp.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
// voice
const mic=document.getElementById("mic");const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){let rec,on=false;mic.onclick=()=>{if(on){rec.stop();return}rec=new SR();rec.lang="en-US";rec.interimResults=true;on=true;mic.classList.add("rec");
  let fin="";rec.onresult=ev=>{let it="";for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else it+=r[0].transcript}inp.value=(fin+it).trim()};
  rec.onend=()=>{on=false;mic.classList.remove("rec");if(inp.value.trim())send()};rec.start()}}
else{mic.onclick=()=>{inp.focus();inp.placeholder="(voice needs Chrome — type instead)"}}
let ft;function flash(){const f=document.getElementById("flash");f.classList.add("on");clearTimeout(ft);ft=setTimeout(()=>f.classList.remove("on"),1000)}
inp.focus();
</script>
</body></html>
